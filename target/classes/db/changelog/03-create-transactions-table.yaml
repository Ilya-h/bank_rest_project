# 03-create-transactions-table.yaml - файл создания таблицы Transactions(Транзакции)

databaseChangeLog:
  - changeSet:
      id: 3
      author: Ilya
      changes:
        - createTable:
            tableName: transactions
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: from_card_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_transaction_from_card
                    foreignKey: true
                    referencedTableName: cards
                    referencedColumnNames: id
              - column:
                  name: to_card_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_transaction_to_card
                    foreignKey: true
                    referencedTableName: cards
                    referencedColumnNames: id
              - column:
                  name: amount
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: "COMPLETED"
              - column:
                  name: transaction_date
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: description
                  type: VARCHAR(255)